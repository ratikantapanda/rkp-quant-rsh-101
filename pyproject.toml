[project]
name = "rkp-quant-rsh-101"
version = "0.1.0"
description = "Professional FRED macro research starter for quant analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.13.0",
  "scipy>=1.11.0",
  "statsmodels>=0.14.0",
  "fredapi>=0.5.0",
  "python-dotenv>=1.0.1",
  "pyarrow>=14.0.0",
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
